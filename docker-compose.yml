version: '3.8'

services:
  shift-board:
    build: .
    ports:
      - "3000:3000"
    environment:
      # These are now optional — only needed to bootstrap the very first
      # run. After that, use the dashboard's "Sprout settings" panel
      # instead; it persists to the volume below and takes over.
      SPROUT_BASE: ${SPROUT_BASE:-https://gateway-sb.sprout.ph}
      SPROUT_CLIENT_ID: ${SPROUT_CLIENT_ID}
      SPROUT_CLIENT_SECRET: ${SPROUT_CLIENT_SECRET}
      SPROUT_SUBSCRIPTION_KEY: ${SPROUT_SUBSCRIPTION_KEY}
      SPROUT_USER_ID: ${SPROUT_USER_ID}
      # Admin logins — see .env.example. Compose can only pass variables by
      # name, so add more ADMIN_<n>_* lines here if you need more than
      # three admins. Blank pairs are ignored by the app.
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_1_ID: ${ADMIN_1_ID:-}
      ADMIN_1_PASSWORD: ${ADMIN_1_PASSWORD:-}
      ADMIN_2_ID: ${ADMIN_2_ID:-}
      ADMIN_2_PASSWORD: ${ADMIN_2_PASSWORD:-}
      ADMIN_3_ID: ${ADMIN_3_ID:-}
      ADMIN_3_PASSWORD: ${ADMIN_3_PASSWORD:-}
    volumes:
      # REQUIRED for settings saved through the dashboard to survive a
      # container restart/recreate. Without this, saved credentials are
      # lost every time the container is rebuilt.
      - shift-board-data:/app/data
    restart: unless-stopped

volumes:
  shift-board-data:
